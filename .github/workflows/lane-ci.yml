# The one required check for the serialized merge lane exercise
# (hivecommons/hive#7563). It runs on every pull request with no path filter,
# so the lane's front never stalls waiting for a check that was never started.
# Three files in the tree steer it:
#   SLOW    sleep 10 minutes, then pass  (a front that is waiting on its check)
#   SLOWER  sleep 20 minutes, then pass  (still in progress at a 15m front timeout)
#   FAIL    fail                          (red at the front)
name: Lane CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Steer by switch files
        run: |
          if [ -f SLOW ]; then echo "SLOW present: sleeping 600s"; sleep 600; fi
          if [ -f SLOWER ]; then echo "SLOWER present: sleeping 1200s"; sleep 1200; fi
          if [ -f FAIL ]; then echo "FAIL present: failing"; exit 1; fi
          echo "no FAIL file: passing"
